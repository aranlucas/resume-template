# Reusable workflow: builds a JSON Resume file into a PDF with this template.
# Uploads the .tex/.pdf as an artifact without writing to the caller’s branch.
# Callers only need `permissions: contents: read`.
#
#   jobs:
#     pdf:
#       uses: aranlucas/resume-template/.github/workflows/build-resume.yml@main
#       with:
#         output: Jane_Doe_Resume
#         runs-on: blacksmith-4vcpu-ubuntu-2404  # optional, default ubuntu-latest

name: Build resume

on:
  workflow_call:
    inputs:
      resume:
        description: JSON Resume file, relative to the caller's repository root
        type: string
        default: resume.json
      output:
        description: Output name without extension; writes <output>.tex and <output>.pdf
        type: string
        default: resume
      artifact-name:
        description: Name of the uploaded TeX/PDF artifact
        type: string
        default: resume
      template:
        description: Template in templates/ to render with (resume or cv)
        type: string
        default: resume
      template-ref:
        description: Ref of aranlucas/resume-template to build with
        type: string
        default: main
      verify:
        description: Run this template revision's PDF regression suite (requires dev dependencies)
        type: boolean
        default: false
      runs-on:
        description: Runner label for the build job
        type: string
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aranlucas/resume-template
          ref: ${{ inputs.template-ref }}
          path: .resume-template
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: .resume-template
          install: false
      - name: Install TeX Live
        run: |
          # The hosted Azure mirror repeatedly stalled TeX downloads until job timeout.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra lmodern poppler-utils
      - name: Install template
        run: pnpm install --frozen-lockfile --prod=${{ !inputs.verify }} --dir .resume-template
      - name: Verify PDF behavior
        if: inputs.verify
        working-directory: .resume-template
        run: |
          pnpm test:pdf
          pnpm test:e2e
      - name: Upload CLI regression evidence
        if: ${{ always() && inputs.verify }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-cli-regression-evidence
          include-hidden-files: true
          path: |
            .resume-template/.e2e/report.json
            .resume-template/.e2e/junit.xml
            .resume-template/.e2e/results
      - name: Build PDF
        env:
          RESUME: ${{ inputs.resume }}
          OUTPUT: ${{ inputs.output }}
          TEMPLATE: ${{ inputs.template }}
        run: |
          node .resume-template/bin/resume-template.mjs "$RESUME" "$OUTPUT" --template "$TEMPLATE"
          pdfinfo "$OUTPUT.pdf" 2>/dev/null | grep Pages || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ inputs.output }}.tex
            ${{ inputs.output }}.pdf
