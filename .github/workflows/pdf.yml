# Rebuilds the sample resume.pdf from resume.json with this commit's template.

name: PDF

on:
  pull_request:
    paths: [resume.json, templates/**, lib/**, bin/**, test/**, package.json, pnpm-lock.yaml, .github/workflows/*.yml]
  push:
    branches: [main]
    paths: [resume.json, templates/**, lib/**, bin/**, test/**, package.json, pnpm-lock.yaml, .github/workflows/*.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  pdf:
    uses: ./.github/workflows/build-resume.yml
    permissions:
      contents: write
    with:
      template-ref: ${{ github.event.pull_request.head.sha || github.sha }}
