# Rebuilds the sample resume.pdf from resume.json with this commit's template.

name: PDF
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      [
        resume.json,
        resume.tex,
        resume.pdf,
        .node-version,
        pnpm-workspace.yaml,
        templates/**,
        lib/**,
        bin/**,
        test/**,
        package.json,
        vitest.config.mjs,
        jsconfig.json,
        pnpm-lock.yaml,
        .oxlintrc.json,
        .github/workflows/*.yml,
      ]
  push:
    branches: [main]
    paths:
      [
        resume.json,
        resume.tex,
        resume.pdf,
        .node-version,
        pnpm-workspace.yaml,
        templates/**,
        lib/**,
        bin/**,
        test/**,
        package.json,
        vitest.config.mjs,
        jsconfig.json,
        pnpm-lock.yaml,
        .oxlintrc.json,
        .github/workflows/*.yml,
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pdf:
    if: ${{ (!github.event.pull_request.draft) && github.event.pull_request.draft !=
      true }}
    uses: ./.github/workflows/build-resume.yml
    permissions:
      contents: read
    with:
      verify: true
      template-ref: ${{ github.event.pull_request.head.sha || github.sha }}
  cv:
    uses: ./.github/workflows/build-resume.yml
    permissions:
      contents: read
    with:
      artifact-name: cv
      template: cv
      output: cv
      template-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    if: ${{ github.event.pull_request.draft != true }}
